[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdsgc"
version = "1.0.0"
description = "Automation bot for Seven Deadly Sins: Grand Cross (Android / ADB)"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0.0",
    "opencv-python>=4.8",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Coordinate/region capture helpers in helper/. Not needed to run the bot.
dev = [
    "matplotlib>=3.7",
]

[project.scripts]
sdsgc = "sdsgc.app:main"

[tool.setuptools.packages.find]
where = ["src"]
